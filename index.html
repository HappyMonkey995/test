<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyWebsite</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
</head>
<body>
  <header>
    <div class="logo">MyWebsite</div>
    <nav>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#features">Features</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section id="home" class="hero">
    <div id="particles-js"></div>
    <div class="hero-content">
      <h1>Futuristic Web Design</h1>
      <p>High-tech, glowing, interactive layout inspired by AcroniX</p>
      <a href="#features" class="btn">Get Started</a>
    </div>
  </section>

  <section id="features" class="features">
    <h2>Features</h2>
    <div class="cards">
      <div class="card">Feature 1</div>
      <div class="card">Feature 2</div>
      <div class="card">Feature 3</div>
    </div>
  </section>

  <section id="contact" class="contact">
    <h2>Contact</h2>
    <form>
      <input type="text" placeholder="Name">
      <input type="email" placeholder="Email">
      <textarea placeholder="Message"></textarea>
      <button>Send</button>
    </form>
  </section>

  <footer>&copy; 2025 MyWebsite</footer>
  <script src="script.js"></script>
</body>
</html>
